openapi: "3.0.3"
info:
  title: LuminaCV API
  description: API documentation for the LuminaCV backend
  version: 1.0.0
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: Auth
    description: Registration and access-token lifecycle
  - name: Users
    description: User administration and lookup
  - name: Candidates
    description: Candidate profiles and claims
  - name: Documents
    description: Candidate document management
  - name: Extraction
    description: Document extraction review
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a candidate
      operationId: registerCandidate
      description: Creates a candidate account and returns a JWT access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                email:
                  type: string
                  format: email
                  maxLength: 320
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        "201":
          $ref: "#/components/responses/AuthSuccess"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/RegistrationConflict"
  /api/auth/sign-in:
    post:
      tags: [Auth]
      summary: Sign in
      operationId: signIn
      description: Authenticates a user and returns a JWT access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 320
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/AccountUnavailable"
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      operationId: logout
      description: Invalidates all access tokens previously issued to the user.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out successfully
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AccountUnavailable"
  /api/candidates/me:
    post:
      tags: [Candidates]
      summary: Create my candidate profile
      operationId: createMyCandidateProfile
      description: Creates a profile for the authenticated candidate.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCandidateProfile"
      responses:
        "201": { $ref: "#/components/responses/CandidateProfileSuccess" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/CandidateAccessRequired" }
        "409": { $ref: "#/components/responses/CandidateProfileConflict" }
    get:
      tags: [Candidates]
      summary: Get my candidate profile
      operationId: getMyCandidateProfile
      description: Returns the authenticated candidate's profile.
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/CandidateProfileSuccess" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/CandidateAccessRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Candidates]
      summary: Update my candidate profile
      operationId: updateMyCandidateProfile
      description: Updates fields on the authenticated candidate's profile.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCandidateProfile"
      responses:
        "200": { $ref: "#/components/responses/CandidateProfileSuccess" }
        "400": { $ref: "#/components/responses/IfMatchValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/CandidateAccessRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
  /api/candidates/me/profile:
    get:
      tags: [Candidates]
      summary: Export my structured profile
      operationId: exportMyCandidateProfile
      description: Returns profile information and accepted claims only.
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/ExportedProfileSuccess" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/CandidateAccessRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/candidates/me/claims:
    post:
      tags: [Candidates]
      summary: Add a manual claim
      operationId: createMyClaim
      description: Adds an accepted claim to the authenticated candidate's profile.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimInput"
      responses:
        "201": { $ref: "#/components/responses/ClaimSuccess" }
        "400": { $ref: "#/components/responses/ClaimInputError" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/CandidateAccessRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Candidates]
      summary: List my claims
      operationId: listMyClaims
      description: Lists the candidate's claims with optional type and status filters.
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/ClaimType"
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, accepted, rejected]
      responses:
        "200": { $ref: "#/components/responses/ClaimListSuccess" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/CandidateAccessRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/candidates/me/claims/{claimId}:
    parameters:
      - $ref: "#/components/parameters/ClaimId"
    get:
      tags: [Candidates]
      summary: Get one of my claims
      operationId: getMyClaim
      description: Returns one claim owned by the authenticated candidate.
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/ClaimSuccess" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/CandidateAccessRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Candidates]
      summary: Update one of my claims
      operationId: updateMyClaim
      description: Updates the values of a candidate-owned claim.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimInput"
      responses:
        "200": { $ref: "#/components/responses/ClaimSuccess" }
        "400": { $ref: "#/components/responses/ClaimUpdateError" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/CandidateAccessRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
    delete:
      tags: [Candidates]
      summary: Delete one of my claims
      operationId: deleteMyClaim
      description: Deletes a claim owned by the authenticated candidate.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204": { description: Claim deleted successfully }
        "400": { $ref: "#/components/responses/IfMatchValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/CandidateAccessRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
  /api/candidates/me/claims/{claimId}/review:
    patch:
      tags: [Candidates]
      summary: Review an extracted claim
      operationId: reviewMyClaim
      description: Accepts or rejects a pending extracted claim.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClaimId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimReview"
      responses:
        "200": { $ref: "#/components/responses/ClaimSuccess" }
        "400": { $ref: "#/components/responses/IfMatchValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/CandidateAccessRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ClaimReviewConflict" }
  /api/candidates/me/documents:
    post:
      tags:
        - Documents
      summary: Upload candidate documents
      operationId: uploadMyDocuments
      description: Uploads one or more files. Repeat the `file` field for multiple files.
      security:
        - bearerAuth: []
      parameters:
        - name: purpose
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/DocumentPurpose"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          $ref: "#/components/responses/DocumentUploadSuccess"
        "201":
          $ref: "#/components/responses/DocumentUploadSuccess"
        "207":
          $ref: "#/components/responses/DocumentUploadSuccess"
        "400":
          $ref: "#/components/responses/DocumentUploadError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
        "413":
          $ref: "#/components/responses/DocumentPayloadTooLarge"
    get:
      tags:
        - Documents
      summary: List my documents
      operationId: listMyDocuments
      description: Lists uploaded documents with optional purpose and status filters.
      security:
        - bearerAuth: []
      parameters:
        - name: purpose
          in: query
          schema:
            $ref: "#/components/schemas/DocumentPurpose"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DocumentStatus"
      responses:
        "200":
          $ref: "#/components/responses/DocumentListSuccess"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
  /api/candidates/me/documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags:
        - Documents
      summary: Get document metadata
      operationId: getMyDocument
      description: Returns metadata for one candidate-owned document.
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/DocumentSuccess"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Documents
      summary: Delete a document
      operationId: deleteMyDocument
      description: Deletes one candidate-owned document and its stored content.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Document deleted successfully
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/candidates/me/documents/{documentId}/content:
    get:
      tags:
        - Documents
      summary: Download document content
      operationId: downloadMyDocument
      description: Downloads the original bytes of a candidate-owned document.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Original document bytes
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/users:
    get:
      tags:
        - Users
      summary: List users
      operationId: listUsers
      description: Lists users for an active administrator.
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/UserListSuccess"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/users/{id}:
    get:
      tags:
        - Users
      summary: Get a user
      operationId: getUser
      description: Returns the authenticated user or any user for an administrator.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          $ref: "#/components/responses/UserSuccess"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/candidates/me/extraction-review-items:
    get:
      tags:
        - Extraction
      summary: List extraction review items
      operationId: listMyExtractionReviewItems
      description: Lists review items with optional document and status filters.
      security:
        - bearerAuth: []
      parameters:
        - name: documentId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ExtractionReviewStatus"
            default: pending
      responses:
        "200":
          $ref: "#/components/responses/ExtractionReviewListSuccess"
        "400":
          $ref: "#/components/responses/IfMatchValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
  /api/candidates/me/extraction-review-items/{reviewItemId}/dismiss:
    patch:
      tags:
        - Extraction
      summary: Dismiss an extraction review item
      operationId: dismissMyExtractionReviewItem
      description: Dismisses a pending extraction review item without creating a claim.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReviewItemId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          $ref: "#/components/responses/ExtractionReviewSuccess"
        "400":
          $ref: "#/components/responses/IfMatchValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ExtractionReviewConflict"
  /api/candidates/me/extraction-review-items/{reviewItemId}/resolve:
    post:
      tags:
        - Extraction
      summary: Resolve an extraction review item
      operationId: resolveMyExtractionReviewItem
      description: Resolves an item with corrected values and creates an accepted claim.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReviewItemId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveExtractionReviewItem"
            example:
              values:
                employer: Lumina
                jobTitle: Software Engineer
                startDate: 2023-01
                endDate: 2025-06
                description: Built and maintained backend services.
                location: Ramallah
      responses:
        "201":
          $ref: "#/components/responses/ExtractionResolutionSuccess"
        "400":
          $ref: "#/components/responses/ExtractionResolutionError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ExtractionReviewConflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ClaimId:
      name: claimId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Optional record version used to prevent concurrent overwrites.
      schema:
        type: string
      example: '"3"'
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReviewItemId:
      name: reviewItemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    AuthSuccess:
      description: Authentication succeeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthResponse"
    CandidateProfileSuccess:
      description: Candidate profile response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CandidateProfileResponse"
    ExportedProfileSuccess:
      description: Structured candidate profile response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExportedProfileResponse"
    ClaimSuccess:
      description: Candidate claim response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClaimResponse"
    ClaimListSuccess:
      description: Candidate claim collection
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClaimListResponse"
    DocumentSuccess:
      description: Document metadata response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DocumentResponse"
    DocumentListSuccess:
      description: Document metadata collection
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DocumentListResponse"
    DocumentUploadSuccess:
      description: Per-file document upload results
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DocumentUploadResponse"
    UserSuccess:
      description: User response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserResponse"
    UserListSuccess:
      description: User collection
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserListResponse"
    ExtractionReviewSuccess:
      description: Extraction review item response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExtractionReviewResponse"
    ExtractionReviewListSuccess:
      description: Extraction review item collection
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExtractionReviewListResponse"
    ExtractionResolutionSuccess:
      description: Resolved review item and accepted claim
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExtractionResolutionResponse"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
    InvalidCredentials:
      description: Email or password is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InvalidCredentialsErrorResponse"
    AuthenticationRequired:
      description: Authentication required or token is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthenticationErrorResponse"
    AccountUnavailable:
      description: Account is not active
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccountUnavailableErrorResponse"
    CandidateAccessRequired:
      description: Active candidate account required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CandidateAccessErrorResponse"
    Forbidden:
      description: Access is forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthorizationErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFoundErrorResponse"
    RegistrationConflict:
      description: An account with this email already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RegistrationConflictErrorResponse"
    CandidateProfileConflict:
      description: Candidate profile already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CandidateProfileConflictErrorResponse"
    IfMatchValidationError:
      description: Request data or If-Match header is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IfMatchValidationErrorResponse"
    ClaimInputError:
      description: Claim data is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClaimInputErrorResponse"
    ClaimUpdateError:
      description: Claim data, type, or If-Match header is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClaimUpdateErrorResponse"
    VersionConflict:
      description: Resource version does not match If-Match
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VersionConflictErrorResponse"
    ClaimReviewConflict:
      description: Claim is not reviewable or its version changed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClaimReviewConflictErrorResponse"
    DocumentUploadError:
      description: Upload query or multipart body is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DocumentUploadErrorResponse"
    DocumentPayloadTooLarge:
      description: A document exceeds the configured size limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DocumentPayloadTooLargeErrorResponse"
    ExtractionReviewConflict:
      description: Review item is not pending or its version changed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExtractionReviewConflictErrorResponse"
    ExtractionResolutionError:
      description: Resolution data, claim values, or If-Match header is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExtractionResolutionErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required:
        - success
        - error
        - timestamp
      additionalProperties: false
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          required:
            - code
            - message
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            details:
              nullable: true
        timestamp:
          type: string
          format: date-time
    ValidationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - $ref: "#/components/schemas/ValidationErrorCode"
    InvalidCredentialsErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - $ref: "#/components/schemas/InvalidCredentialsErrorCode"
    AuthenticationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - $ref: "#/components/schemas/AuthenticationErrorCode"
    AccountUnavailableErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - $ref: "#/components/schemas/AccountUnavailableErrorCode"
    CandidateAccessErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - $ref: "#/components/schemas/CandidateAccessErrorCode"
    AuthorizationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - $ref: "#/components/schemas/CandidateAccessErrorCode"
    NotFoundErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - $ref: "#/components/schemas/NotFoundErrorCode"
    RegistrationConflictErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - $ref: "#/components/schemas/RegistrationConflictErrorCode"
    CandidateProfileConflictErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
