      type: string
      pattern: '^\d{4}(-(0[1-9]|1[0-2]))?$'
      example: 2024-06
    SkillClaimValues:
      title: Skill
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '\S'
