        - $ref: "#/components/schemas/LanguageClaimRecord"
        - $ref: "#/components/schemas/ProjectClaimRecord"
      discriminator:
        propertyName: claimType
        mapping:
          skill: "#/components/schemas/SkillClaimRecord"
          employment: "#/components/schemas/EmploymentClaimRecord"
          education: "#/components/schemas/EducationClaimRecord"
          certification: "#/components/schemas/CertificationClaimRecord"
          language: "#/components/schemas/LanguageClaimRecord"
          project: "#/components/schemas/ProjectClaimRecord"
    ClaimRecordBase:
      type: object
      required:
        - claimId
        - origin
        - status
        - extraction
        - version
        - createdAt
        - updatedAt
      properties:
        claimId:
          type: string
          format: uuid
        origin:
          type: string
          enum:
            - manual
            - extracted
        status:
          type: string
          enum:
            - pending
            - accepted
            - rejected
        values:
          description: Type-specific normalized claim fields.
        extraction:
          $ref: "#/components/schemas/ClaimExtraction"
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ClaimExtraction:
      type: object
      nullable: true
      required:
        - invocationId
        - sourceDocumentId
        - rawValues
        - fieldSources
        - current
      additionalProperties: false
      properties:
        invocationId:
          type: string
          format: uuid
        sourceDocumentId:
          type: string
          format: uuid
          nullable: true
        rawValues:
          type: object
          additionalProperties:
            type: string
        fieldSources:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        current:
          type: boolean
