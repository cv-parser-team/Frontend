                    - INVALID_DOCUMENT_FILENAME
                    - EMPTY_DOCUMENT
                    - UNSUPPORTED_DOCUMENT_TYPE
                    - DOCUMENT_PURPOSE_MISMATCH
                    - DOCUMENT_BEING_DELETED
                    - CORRUPTED_DOCUMENT
                    - DOCUMENT_TOO_LARGE
                    - DOCUMENT_UPLOAD_FAILED
                message:
                  type: string
    DocumentUploadResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/DocumentUploadResult"
            limit:
              type: object
              required:
                - reached
                - maximumFiles
              additionalProperties: false
              properties:
                reached:
                  type: boolean
                  enum:
                    - true
                maximumFiles:
                  type: integer
                  minimum: 1
    User:
      type: object
      required:
        - userId
        - name
        - email
        - role
        - accountStatus
        - emailVerifiedAt
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - candidate
            - reviewer
            - admin
        accountStatus:
          type: string
          enum:
            - active
            - suspended
            - disabled
        emailVerifiedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required:
            - data
          properties:
            data:
              $ref: "#/components/schemas/User"
    UserListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/User"
    ExtractionReviewItem:
      type: object
      required:
        - reviewItemId
        - documentId
        - claimType
        - fields
        - issues
        - sources
        - status
        - resolvedClaimId
        - version
      additionalProperties: false
      properties:
        reviewItemId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        claimType:
          $ref: "#/components/schemas/ClaimType"
        fields:
          type: object
          additionalProperties: true
        issues:
          type: array
          items:
            type: object
            required:
              - field
              - code
              - required
            additionalProperties: false
            properties:
              field:
                type: string
                nullable: true
              code:
                type: string
              required:
                type: boolean
        sources:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/ExtractionReviewStatus"
        resolvedClaimId:
          type: string
          format: uuid
          nullable: true
        version:
          type: integer
          minimum: 1
    ExtractionReviewResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required:
            - data
          properties:
            data:
              $ref: "#/components/schemas/ExtractionReviewItem"
    ExtractionReviewListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/ExtractionReviewItem"
    ExtractionResolutionResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required:
            - data
          properties:
            data:
              type: object
              required:
                - reviewItem
                - claim
              additionalProperties: false
              properties:
                reviewItem:
                  $ref: "#/components/schemas/ExtractionReviewItem"
                claim:
                  $ref: "#/components/schemas/ClaimRecord"
    DocumentPurpose:
      type: string
      enum:
        - source
        - evidence
    DocumentStatus:
      type: string
      enum:
        - stored
        - processing
        - ready
        - failed
        - deleting
    ExtractionReviewStatus:
      type: string
      enum:
        - pending
        - resolved
        - dismissed
    ResolveExtractionReviewItem:
      type: object
      required:
        - values
      additionalProperties: false
      properties:
        values:
          description: Must match the claim type stored on the review item.
          oneOf:
            - $ref: "#/components/schemas/SkillClaimValues"
            - $ref: "#/components/schemas/EmploymentClaimValues"
            - $ref: "#/components/schemas/EducationClaimValues"
            - $ref: "#/components/schemas/CertificationClaimValues"
            - $ref: "#/components/schemas/LanguageClaimValues"
            - $ref: "#/components/schemas/ProjectClaimValues"
    ProfileLink:
      type: object
      required: [label, url]
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 50 }
        url: { type: string, format: uri, maxLength: 2048 }
    CreateCandidateProfile:
      type: object
      required: [fullName]
      additionalProperties: false
      properties:
        fullName: { type: string, minLength: 1, maxLength: 200 }
        headline: { type: string, minLength: 1, maxLength: 200 }
        summary: { type: string, minLength: 1, maxLength: 5000 }
        phone: { type: string, minLength: 1, maxLength: 30 }
        location: { type: string, minLength: 1, maxLength: 200 }
        contactEmail: { type: string, format: email, maxLength: 320 }
        profileLinks:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ProfileLink"
    UpdateCandidateProfile:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        fullName: { type: string, minLength: 1, maxLength: 200 }
        headline: { type: string, nullable: true, maxLength: 200 }
        summary: { type: string, nullable: true, maxLength: 5000 }
        phone: { type: string, nullable: true, maxLength: 30 }
        location: { type: string, nullable: true, maxLength: 200 }
        contactEmail:
          { type: string, format: email, nullable: true, maxLength: 320 }
        profileLinks:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ProfileLink"
    ClaimType:
      type: string
      enum: [skill, employment, education, certification, language, project]
    ClaimInput:
      type: object
      required: [type, values]
      additionalProperties: false
      properties:
        type:
          $ref: "#/components/schemas/ClaimType"
        values:
          description: Must match the selected claim type. On update, the type must also match the existing claim.
          oneOf:
            - $ref: "#/components/schemas/SkillClaimValues"
            - $ref: "#/components/schemas/EmploymentClaimValues"
            - $ref: "#/components/schemas/EducationClaimValues"
            - $ref: "#/components/schemas/CertificationClaimValues"
            - $ref: "#/components/schemas/LanguageClaimValues"
            - $ref: "#/components/schemas/ProjectClaimValues"
    ClaimReview:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [accepted, rejected]
