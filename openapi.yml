        description:
          type: string
          minLength: 1
          maxLength: 5000
          pattern: '\S'
        location:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '\S'
        skills:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 100
            pattern: '\S'
