      properties:
        code:
          type: string
          enum:
          - VALIDATION_ERROR
          - INVALID_CLAIM_DATES
          - INVALID_CLAIM_VALUES
    ClaimBatchInputErrorCode_error:
      type: object
      properties:
        code:
          type: string
          enum:
          - VALIDATION_ERROR
          - OVERLAPPING_BATCH_CLAIMS
    ClaimUpdateErrorCode_error:
      type: object
      properties:
        code:
          type: string
          enum:
          - VALIDATION_ERROR
          - INVALID_IF_MATCH
          - INVALID_CLAIM_DATES
          - INVALID_CLAIM_VALUES
          - CLAIM_TYPE_MISMATCH
    VersionConflictErrorCode_error:
      type: object
      properties:
        code:
          type: string
          enum:
          - VERSION_CONFLICT
    ClaimReviewConflictErrorCode_error:
      type: object
      properties:
        code:
          type: string
          enum:
          - VERSION_CONFLICT
          - CLAIM_NOT_REVIEWABLE
    DocumentUploadErrorCode_error:
      type: object
      properties:
        code:
          type: string
          enum:
          - VALIDATION_ERROR
          - INVALID_DOCUMENT_UPLOAD
    DocumentPayloadTooLargeErrorCode_error:
      type: object
      properties:
        code:
          type: string
          enum:
          - DOCUMENT_TOO_LARGE
          - FST_REQ_FILE_TOO_LARGE
    ExtractionReviewConflictErrorCode_error:
      type: object
      properties:
        code:
          type: string
          enum:
          - VERSION_CONFLICT
          - EXTRACTION_REVIEW_ITEM_NOT_PENDING
    ExtractionResolutionErrorCode_error:
      type: object
      properties:
        code:
          type: string
          enum:
          - VALIDATION_ERROR
          - INVALID_IF_MATCH
          - INVALID_CLAIM_DATES
          - INVALID_CLAIM_VALUES
    AuthResponse_data:
      required:
      - accessToken
      - userId
      type: object
      properties:
        userId:
          type: string
          format: uuid
        accessToken:
          type: string
      additionalProperties: false
    PdfLineAnchor_box:
      required:
      - height
      - width
      - x
      - "y"
      type: object
      properties:
        x:
          type: number
        "y":
          type: number
        width:
          type: number
        height:
          type: number
      additionalProperties: false
    DocumentUploadResult_error:
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
          enum:
          - INVALID_DOCUMENT_FILENAME
          - EMPTY_DOCUMENT
          - UNSUPPORTED_DOCUMENT_TYPE
          - DOCUMENT_PURPOSE_MISMATCH
          - DOCUMENT_BEING_DELETED
          - CORRUPTED_DOCUMENT
          - DOCUMENT_TOO_LARGE
          - DOCUMENT_UPLOAD_FAILED
        message:
          type: string
      additionalProperties: false
    DocumentUploadResponse_limit:
      required:
      - maximumFiles
      - reached
      type: object
      properties:
        reached:
          type: boolean
          enum:
          - true
        maximumFiles:
          minimum: 1
          type: integer
      additionalProperties: false
    ExtractionReviewItem_issues:
      required:
      - code
      - field
      - required
      type: object
      properties:
        field:
          type: string
          nullable: true
        code:
          $ref: "#/components/schemas/ExtractionReviewIssueCode"
        required:
          type: boolean
      additionalProperties: false
    ExtractionResolutionResponse_data:
      required:
      - claim
      - reviewItem
      type: object
      properties:
        reviewItem:
          $ref: "#/components/schemas/ExtractionReviewItem"
        claim:
          $ref: "#/components/schemas/ClaimRecord"
      additionalProperties: false
  responses:
    AuthSuccess:
      description: Authentication succeeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthResponse"
    CandidateProfileSuccess:
      description: Candidate profile response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CandidateProfileResponse"
    ExportedProfileSuccess:
      description: Structured candidate profile response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExportedProfileResponse"
    ClaimSuccess:
      description: Candidate claim response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClaimResponse"
    ClaimListSuccess:
      description: Candidate claim collection
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClaimListResponse"
    ClaimMergeProposalSuccess:
      description: Read-only claim merge proposal
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClaimMergeProposalResponse"
    ClaimMergeCandidateListSuccess:
      description: Read-only candidate duplicate proposals
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClaimMergeCandidateListResponse"
    ClaimCoalesceSuccess:
      description: Safe pending-claim coalescing result
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClaimCoalesceResponse"
    RecordClaimsDifferentSuccess:
      description: Candidate claim-pair decision result
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RecordClaimsDifferentResponse"
    ClaimBatchResolutionSuccess:
      description: Ordered per-item claim resolution outcomes
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClaimBatchResolutionResponse"
    ConfirmedClaimMergeSuccess:
      description: Candidate-confirmed claim merge result
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConfirmedClaimMergeResponse"
    DocumentSuccess:
      description: Document metadata response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DocumentResponse"
    DocumentListSuccess:
      description: Document metadata collection
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DocumentListResponse"
    DocumentUploadSuccess:
      description: Per-file document upload results
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DocumentUploadResponse"
    UserSuccess:
      description: User response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserResponse"
    UserListSuccess:
      description: User collection
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserListResponse"
    ExtractionReviewSuccess:
      description: Extraction review item response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExtractionReviewResponse"
    ExtractionReviewListSuccess:
      description: Extraction review item collection
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExtractionReviewListResponse"
    ExtractionResolutionSuccess:
      description: Resolved review item and accepted claim
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExtractionResolutionResponse"
    ValidationError:
