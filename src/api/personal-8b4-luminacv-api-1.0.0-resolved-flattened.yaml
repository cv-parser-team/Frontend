        application/json:
          schema:
            $ref: "#/components/schemas/ExtractionResolutionErrorResponse"
  parameters:
    ClaimId:
      name: claimId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LeftClaimId:
      name: leftClaimId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    RightClaimId:
      name: rightClaimId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
