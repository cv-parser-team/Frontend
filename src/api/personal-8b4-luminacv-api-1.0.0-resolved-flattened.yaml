openapi: 3.0.3
info:
  title: LuminaCV API
  description: API documentation for the LuminaCV backend
  version: 1.0.0
servers:
- url: http://localhost:4000
  description: Local development
tags:
- name: Auth
  description: Registration and access-token lifecycle
- name: Users
  description: User administration and lookup
- name: Candidates - Profile
  description: "Candidate profile creation, maintenance, and export"
- name: Candidates - Claims
  description: "Claim creation, lifecycle management, and extracted-claim review"
- name: Candidates - Claim Review
  description: Duplicate-claim discovery and resolution
- name: Documents
  description: Candidate document management
- name: Extraction
  description: Document extraction review
paths:
  /api/auth/register:
    post:
      tags:
      - Auth
      summary: Register a candidate
      description: Creates a candidate account and returns a JWT access token.
      operationId: registerCandidate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/auth_register_body"
        required: true
      responses:
        "201":
          $ref: "#/components/responses/AuthSuccess"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/RegistrationConflict"
  /api/auth/sign-in:
    post:
      tags:
      - Auth
      summary: Sign in
      description: Authenticates a user and returns a JWT access token.
      operationId: signIn
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/auth_signin_body"
        required: true
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/AccountUnavailable"
  /api/auth/logout:
    post:
      tags:
      - Auth
      summary: Log out
      description: Invalidates all access tokens previously issued to the user.
      operationId: logout
      responses:
        "204":
          description: Logged out successfully
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AccountUnavailable"
      security:
      - bearerAuth: []
  /api/candidates/me:
    get:
      tags:
      - Candidates - Profile
      summary: Get my candidate profile
      description: Returns the authenticated candidate's profile.
      operationId: getMyCandidateProfile
      responses:
        "200":
          $ref: "#/components/responses/CandidateProfileSuccess"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - bearerAuth: []
    post:
      tags:
      - Candidates - Profile
      summary: Create my candidate profile
      description: Creates a profile for the authenticated candidate.
      operationId: createMyCandidateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCandidateProfile"
        required: true
      responses:
        "201":
          $ref: "#/components/responses/CandidateProfileSuccess"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
        "409":
          $ref: "#/components/responses/CandidateProfileConflict"
      security:
      - bearerAuth: []
    patch:
      tags:
      - Candidates - Profile
      summary: Update my candidate profile
      description: Updates fields on the authenticated candidate's profile.
      operationId: updateMyCandidateProfile
      parameters:
      - name: If-Match
        in: header
        description: Optional record version used to prevent concurrent overwrites.
        required: false
        schema:
          type: string
        example: '"3"'
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCandidateProfile"
        required: true
      responses:
        "200":
          $ref: "#/components/responses/CandidateProfileSuccess"
        "400":
          $ref: "#/components/responses/IfMatchValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
      security:
      - bearerAuth: []
  /api/candidates/me/profile:
    get:
      tags:
      - Candidates - Profile
      summary: Export my structured profile
      description: Returns profile information and accepted claims only.
      operationId: exportMyCandidateProfile
      responses:
        "200":
          $ref: "#/components/responses/ExportedProfileSuccess"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - bearerAuth: []
  /api/candidates/me/claims:
    get:
      tags:
      - Candidates - Claims
      summary: List my claims
      description: Lists the candidate's claims with optional type and status filters.
      operationId: listMyClaims
      parameters:
      - name: type
        in: query
        required: false
        schema:
          $ref: "#/components/schemas/ClaimType"
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - pending
          - accepted
          - rejected
      responses:
        "200":
          $ref: "#/components/responses/ClaimListSuccess"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - bearerAuth: []
    post:
      tags:
      - Candidates - Claims
      summary: Add a manual claim
      description: Adds an accepted claim to the authenticated candidate's profile.
      operationId: createMyClaim
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimInput"
        required: true
      responses:
        "201":
          $ref: "#/components/responses/ClaimSuccess"
        "400":
          $ref: "#/components/responses/ClaimInputError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - bearerAuth: []
  /api/candidates/me/claims/merge-candidates:
    get:
      tags:
      - Candidates - Claim Review
      summary: List suspected duplicate claim pairs
      description: Lists suspected duplicate pairs without changing or exporting claims.
      operationId: listMyClaimMergeCandidates
      responses:
        "200":
          $ref: "#/components/responses/ClaimMergeCandidateListSuccess"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - bearerAuth: []
  /api/candidates/me/claims/merge-proposal:
    get:
      tags:
      - Candidates - Claim Review
      summary: Compare two claims and build a merge proposal
      description: Compares two claims and proposes merged values without changing either claim.
      operationId: getMyClaimMergeProposal
      parameters:
      - name: leftClaimId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: rightClaimId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          $ref: "#/components/responses/ClaimMergeProposalSuccess"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - bearerAuth: []
  /api/candidates/me/claims/coalesce:
    post:
      tags:
      - Candidates - Claim Review
      summary: Safely coalesce pending extracted claims
      description: Safely combines compatible pending extracted claims while keeping the survivor pending.
      operationId: coalesceMyPendingClaims
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimPairRequest"
        required: true
      responses:
        "200":
          $ref: "#/components/responses/ClaimCoalesceSuccess"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
      security:
      - bearerAuth: []
  /api/candidates/me/claims/different:
    post:
      tags:
      - Candidates - Claim Review
      summary: Mark suspected duplicate claims as different
      description: Suppresses an unchanged pair after the candidate confirms the claims are different.
      operationId: markMyClaimsDifferent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordClaimsDifferentRequest"
        required: true
      responses:
        "200":
          $ref: "#/components/responses/RecordClaimsDifferentSuccess"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
      security:
      - bearerAuth: []
  /api/candidates/me/claims/resolve-batch:
    post:
      tags:
      - Candidates - Claim Review
      summary: Resolve selected claims and duplicate pairs
      description: Concurrently accepts or merges independent reviewed claims and returns per-item results.
      operationId: resolveMyClaimBatch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimBatchResolutionRequest"
        required: true
      responses:
        "200":
          $ref: "#/components/responses/ClaimBatchResolutionSuccess"
        "400":
          $ref: "#/components/responses/ClaimBatchInputError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
      security:
      - bearerAuth: []
  /api/candidates/me/claims/merge:
    post:
      tags:
      - Candidates - Claim Review
      summary: Confirm and apply a claim merge
      description: "Applies a confirmed merge, exports the accepted survivor, and retires the duplicate."
      operationId: mergeMyConfirmedClaims
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmedClaimMergeRequest"
        required: true
      responses:
        "200":
          $ref: "#/components/responses/ConfirmedClaimMergeSuccess"
        "400":
          $ref: "#/components/responses/ClaimInputError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
      security:
      - bearerAuth: []
  /api/candidates/me/claims/{claimId}:
    get:
      tags:
      - Candidates - Claims
      summary: Get one of my claims
      description: Returns one claim owned by the authenticated candidate.
      operationId: getMyClaim
      parameters:
      - name: claimId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          $ref: "#/components/responses/ClaimSuccess"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - bearerAuth: []
    put:
      tags:
      - Candidates - Claims
      summary: Update one of my claims
      description: Updates the values of a candidate-owned claim.
      operationId: updateMyClaim
      parameters:
      - name: claimId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        description: Optional record version used to prevent concurrent overwrites.
        required: false
        schema:
          type: string
        example: '"3"'
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimInput"
        required: true
      responses:
        "200":
          $ref: "#/components/responses/ClaimSuccess"
        "400":
          $ref: "#/components/responses/ClaimUpdateError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
      security:
      - bearerAuth: []
    delete:
      tags:
      - Candidates - Claims
      summary: Delete one of my claims
      description: Deletes a claim owned by the authenticated candidate.
      operationId: deleteMyClaim
      parameters:
      - name: claimId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        description: Optional record version used to prevent concurrent overwrites.
        required: false
        schema:
          type: string
        example: '"3"'
      responses:
        "204":
          description: Claim deleted successfully
        "400":
          $ref: "#/components/responses/IfMatchValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
      security:
      - bearerAuth: []
  /api/candidates/me/claims/{claimId}/review:
    patch:
      tags:
      - Candidates - Claims
      summary: Review an extracted claim
      description: Accepts or rejects a pending extracted claim.
      operationId: reviewMyClaim
      parameters:
      - name: claimId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        description: Optional record version used to prevent concurrent overwrites.
        required: false
        schema:
          type: string
        example: '"3"'
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimReview"
        required: true
      responses:
        "200":
          $ref: "#/components/responses/ClaimSuccess"
        "400":
          $ref: "#/components/responses/IfMatchValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ClaimReviewConflict"
      security:
      - bearerAuth: []
  /api/candidates/me/documents:
    get:
      tags:
      - Documents
      summary: List my documents
      description: Lists uploaded documents with optional purpose and status filters.
      operationId: listMyDocuments
      parameters:
      - name: purpose
        in: query
        required: false
        schema:
          $ref: "#/components/schemas/DocumentPurpose"
      - name: status
        in: query
        required: false
        schema:
          $ref: "#/components/schemas/DocumentStatus"
      responses:
        "200":
          $ref: "#/components/responses/DocumentListSuccess"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
      security:
      - bearerAuth: []
    post:
      tags:
      - Documents
      summary: Upload candidate documents
      description: Uploads one or more files. Repeat the `file` field for multiple files.
      operationId: uploadMyDocuments
      parameters:
      - name: purpose
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/DocumentPurpose"
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/me_documents_body"
        required: true
      responses:
        "200":
          $ref: "#/components/responses/DocumentUploadSuccess"
        "201":
          $ref: "#/components/responses/DocumentUploadSuccess"
        "207":
          $ref: "#/components/responses/DocumentUploadSuccess"
        "400":
          $ref: "#/components/responses/DocumentUploadError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
        "413":
          $ref: "#/components/responses/DocumentPayloadTooLarge"
      security:
      - bearerAuth: []
  /api/candidates/me/documents/{documentId}:
    get:
      tags:
      - Documents
      summary: Get document metadata
      description: Returns metadata for one candidate-owned document.
      operationId: getMyDocument
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          $ref: "#/components/responses/DocumentSuccess"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - bearerAuth: []
    delete:
      tags:
      - Documents
      summary: Delete a document
      description: Deletes one candidate-owned document and its stored content.
      operationId: deleteMyDocument
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Document deleted successfully
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - bearerAuth: []
  /api/candidates/me/documents/{documentId}/content:
    get:
      tags:
      - Documents
      summary: Download document content
      description: Downloads the original bytes of a candidate-owned document.
      operationId: downloadMyDocument
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Original document bytes
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - bearerAuth: []
  /api/users:
    get:
      tags:
      - Users
      summary: List users
      description: Lists users for an active administrator.
      operationId: listUsers
      responses:
        "200":
          $ref: "#/components/responses/UserListSuccess"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
      security:
      - bearerAuth: []
  /api/users/{id}:
    get:
      tags:
      - Users
      summary: Get a user
      description: Returns the authenticated user or any user for an administrator.
      operationId: getUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          $ref: "#/components/responses/UserSuccess"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - bearerAuth: []
  /api/candidates/me/extraction-review-items:
    get:
      tags:
      - Extraction
      summary: List extraction review items
      description: Lists review items with optional document and status filters.
      operationId: listMyExtractionReviewItems
      parameters:
      - name: documentId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          $ref: "#/components/schemas/ExtractionReviewStatus"
      responses:
        "200":
          $ref: "#/components/responses/ExtractionReviewListSuccess"
        "400":
          $ref: "#/components/responses/IfMatchValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
      security:
      - bearerAuth: []
  /api/candidates/me/extraction-review-items/{reviewItemId}/dismiss:
    patch:
      tags:
      - Extraction
      summary: Dismiss an extraction review item
      description: Dismisses a pending extraction review item without creating a claim.
      operationId: dismissMyExtractionReviewItem
      parameters:
      - name: reviewItemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        description: Optional record version used to prevent concurrent overwrites.
        required: false
        schema:
          type: string
        example: '"3"'
      responses:
        "200":
          $ref: "#/components/responses/ExtractionReviewSuccess"
        "400":
          $ref: "#/components/responses/IfMatchValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ExtractionReviewConflict"
      security:
      - bearerAuth: []
  /api/candidates/me/extraction-review-items/{reviewItemId}/resolve:
    post:
      tags:
      - Extraction
      summary: Resolve an extraction review item
      description: Resolves an item with corrected values and creates an accepted claim.
      operationId: resolveMyExtractionReviewItem
      parameters:
      - name: reviewItemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        description: Optional record version used to prevent concurrent overwrites.
        required: false
        schema:
          type: string
        example: '"3"'
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveExtractionReviewItem"
            example:
              values:
                employer: Lumina
                jobTitle: Software Engineer
                startDate: 2023-01
                endDate: 2025-06
                description: Built and maintained backend services.
                location: Ramallah
        required: true
      responses:
        "201":
          $ref: "#/components/responses/ExtractionResolutionSuccess"
        "400":
          $ref: "#/components/responses/ExtractionResolutionError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/CandidateAccessRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ExtractionReviewConflict"
      security:
      - bearerAuth: []
components:
  schemas:
    ErrorResponse:
      required:
      - error
      - success
      - timestamp
      type: object
      properties:
        success:
          type: boolean
          enum:
          - false
        error:
          $ref: "#/components/schemas/ErrorResponse_error"
        timestamp:
          type: string
          format: date-time
      additionalProperties: false
    ValidationErrorResponse:
      allOf:
      - $ref: "#/components/schemas/ErrorResponse"
      - $ref: "#/components/schemas/ValidationErrorCode"
    InvalidCredentialsErrorResponse:
      allOf:
      - $ref: "#/components/schemas/ErrorResponse"
      - $ref: "#/components/schemas/InvalidCredentialsErrorCode"
    AuthenticationErrorResponse:
      allOf:
      - $ref: "#/components/schemas/ErrorResponse"
      - $ref: "#/components/schemas/AuthenticationErrorCode"
    AccountUnavailableErrorResponse:
      allOf:
      - $ref: "#/components/schemas/ErrorResponse"
      - $ref: "#/components/schemas/AccountUnavailableErrorCode"
    CandidateAccessErrorResponse:
      allOf:
      - $ref: "#/components/schemas/ErrorResponse"
      - $ref: "#/components/schemas/CandidateAccessErrorCode"
    AuthorizationErrorResponse:
      allOf:
