          education: "#/components/schemas/EducationClaimRecord"
          certification: "#/components/schemas/CertificationClaimRecord"
          language: "#/components/schemas/LanguageClaimRecord"
          project: "#/components/schemas/ProjectClaimRecord"
      oneOf:
      - $ref: "#/components/schemas/SkillClaimRecord"
      - $ref: "#/components/schemas/EmploymentClaimRecord"
      - $ref: "#/components/schemas/EducationClaimRecord"
      - $ref: "#/components/schemas/CertificationClaimRecord"
      - $ref: "#/components/schemas/LanguageClaimRecord"
      - $ref: "#/components/schemas/ProjectClaimRecord"
    ClaimRecordBase:
      required:
      - claimId
      - createdAt
      - extraction
      - origin
      - status
      - updatedAt
      - version
      type: object
      properties:
        claimId:
          type: string
          format: uuid
        origin:
          type: string
          enum:
          - manual
          - extracted
        status:
          type: string
          enum:
          - pending
          - accepted
          - rejected
        values:
          description: Type-specific normalized claim fields.
        extraction:
          $ref: "#/components/schemas/ClaimExtraction"
        version:
          minimum: 1
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ClaimExtraction:
      required:
      - current
      - fieldSources
      - invocationId
      - rawValues
      - sourceDocumentId
      type: object
      properties:
        invocationId:
          type: string
          format: uuid
        sourceDocumentId:
          type: string
          format: uuid
          nullable: true
        rawValues:
          type: object
          additionalProperties:
            type: string
        fieldSources:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        current:
          type: boolean
      additionalProperties: false
      nullable: true
    ClaimDate:
      pattern: "^\\d{4}(-(0[1-9]|1[0-2]))?$"
      type: string
      example: 2024-06
    SkillClaimValues:
      title: Skill
      required:
      - name
      type: object
      properties:
        name:
          maxLength: 100
          minLength: 1
          pattern: \S
          type: string
      additionalProperties: false
    EmploymentClaimValues:
      title: Employment
      required:
      - employer
      - jobTitle
      - startDate
      type: object
      properties:
        employer:
          maxLength: 200
          minLength: 1
          pattern: \S
          type: string
        jobTitle:
          maxLength: 200
          minLength: 1
          pattern: \S
          type: string
        startDate:
          $ref: "#/components/schemas/ClaimDate"
        endDate:
          $ref: "#/components/schemas/ClaimDate"
        description:
          maxLength: 5000
          minLength: 1
          pattern: \S
          type: string
        location:
          maxLength: 200
          minLength: 1
          pattern: \S
          type: string
        skills:
          maxItems: 50
          type: array
          items:
            maxLength: 100
            minLength: 1
            pattern: \S
            type: string
      additionalProperties: false
    EducationClaimValues:
      title: Education
      required:
      - degree
      - institution
      - startDate
      type: object
      properties:
        institution:
          maxLength: 200
          minLength: 1
          pattern: \S
          type: string
        degree:
          maxLength: 200
          minLength: 1
          pattern: \S
          type: string
        fieldOfStudy:
          maxLength: 200
          minLength: 1
          pattern: \S
          type: string
        startDate:
          $ref: "#/components/schemas/ClaimDate"
        endDate:
          $ref: "#/components/schemas/ClaimDate"
      additionalProperties: false
    CertificationClaimValues:
      title: Certification
      required:
      - issueDate
      - issuer
      - title
      type: object
      properties:
        title:
          maxLength: 200
          minLength: 1
          pattern: \S
          type: string
        issuer:
          maxLength: 200
          minLength: 1
          pattern: \S
          type: string
        issueDate:
          $ref: "#/components/schemas/ClaimDate"
        expiryDate:
          $ref: "#/components/schemas/ClaimDate"
        credentialId:
          maxLength: 100
          minLength: 1
          pattern: \S
          type: string
      additionalProperties: false
    LanguageClaimValues:
      title: Language
      required:
      - name
      type: object
      properties:
        name:
          maxLength: 100
          minLength: 1
          pattern: \S
          type: string
        proficiency:
          maxLength: 100
          minLength: 1
          pattern: \S
          type: string
      additionalProperties: false
    ProjectClaimValues:
      title: Project
      required:
      - name
      type: object
      properties:
        name:
          maxLength: 200
          minLength: 1
          pattern: \S
          type: string
        description:
          maxLength: 5000
          minLength: 1
          pattern: \S
          type: string
        role:
          maxLength: 200
          minLength: 1
          pattern: \S
          type: string
        url:
          maxLength: 2048
          type: string
          format: uri
        startDate:
          $ref: "#/components/schemas/ClaimDate"
        endDate:
          $ref: "#/components/schemas/ClaimDate"
        skills:
          maxItems: 50
          type: array
          items:
            maxLength: 100
            minLength: 1
            pattern: \S
            type: string
      additionalProperties: false
    SkillClaimRecord:
      title: Skill claim
      allOf:
