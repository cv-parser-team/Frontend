      - rightClaimId
      type: object
      properties:
        leftClaimId:
          type: string
          format: uuid
        rightClaimId:
          type: string
          format: uuid
      additionalProperties: false
    RecordClaimsDifferentRequest:
      required:
      - leftClaimId
      - leftVersion
      - rightClaimId
      - rightVersion
      type: object
      properties:
        leftClaimId:
          type: string
          format: uuid
        rightClaimId:
          type: string
          format: uuid
        leftVersion:
          minimum: 1
          type: integer
        rightVersion:
          minimum: 1
          type: integer
      additionalProperties: false
    ClaimBatchAcceptAction:
      required:
      - action
      - claimId
      - version
      type: object
      properties:
        action:
          type: string
          enum:
          - accept_claim
        claimId:
          type: string
          format: uuid
        version:
          minimum: 1
          type: integer
      additionalProperties: false
    ClaimBatchMergeAction:
      required:
      - action
      - leftClaimId
      - leftVersion
      - rightClaimId
      - rightVersion
      - survivorClaimId
      - values
      type: object
      properties:
        action:
          type: string
          enum:
          - merge_claims
        leftClaimId:
          type: string
          format: uuid
        rightClaimId:
          type: string
          format: uuid
        leftVersion:
          minimum: 1
          type: integer
        rightVersion:
          minimum: 1
          type: integer
        survivorClaimId:
          type: string
          format: uuid
        values:
          description: Final values validated against the stored claim type.
          anyOf:
          - $ref: "#/components/schemas/SkillClaimValues"
          - $ref: "#/components/schemas/EmploymentClaimValues"
          - $ref: "#/components/schemas/EducationClaimValues"
          - $ref: "#/components/schemas/CertificationClaimValues"
          - $ref: "#/components/schemas/LanguageClaimValues"
          - $ref: "#/components/schemas/ProjectClaimValues"
        current:
          type: boolean
      additionalProperties: false
    ClaimBatchResolutionRequest:
      required:
      - actions
      type: object
      properties:
        actions:
          maxItems: 100
          minItems: 1
          type: array
          items:
            oneOf:
            - $ref: "#/components/schemas/ClaimBatchAcceptAction"
            - $ref: "#/components/schemas/ClaimBatchMergeAction"
      additionalProperties: false
    ConfirmedClaimMergeRequest:
      required:
      - leftClaimId
      - leftVersion
      - rightClaimId
      - rightVersion
      - survivorClaimId
      - values
      type: object
      properties:
        leftClaimId:
          type: string
          format: uuid
        rightClaimId:
          type: string
          format: uuid
        leftVersion:
          minimum: 1
          type: integer
        rightVersion:
          minimum: 1
          type: integer
        survivorClaimId:
          type: string
          format: uuid
        values:
          description: Final values validated against the stored claim type.
          anyOf:
          - $ref: "#/components/schemas/SkillClaimValues"
          - $ref: "#/components/schemas/EmploymentClaimValues"
          - $ref: "#/components/schemas/EducationClaimValues"
          - $ref: "#/components/schemas/CertificationClaimValues"
          - $ref: "#/components/schemas/LanguageClaimValues"
          - $ref: "#/components/schemas/ProjectClaimValues"
        current:
          type: boolean
          description: "Whether an employment, education, or project claim is ongoing."
      additionalProperties: false
    ClaimVersionReference:
      required:
      - claimId
      - version
      type: object
      properties:
        claimId:
          type: string
          format: uuid
        version:
          minimum: 1
          type: integer
      additionalProperties: false
    ClaimMergeNoProposal:
      required:
      - reason
      - result
      type: object
      properties:
        result:
          type: string
          enum:
          - no_proposal
        reason:
          type: string
          enum:
          - different_candidate
          - different_type
          - different_identity
          - unsupported_type
          - same_claim
          - rejected_claim
          - superseded_claim
      additionalProperties: false
    ClaimMergeDateValue:
      description: "A normalized date used while comparing claims. It can be explicit, ongoing, or missing."
      oneOf:
      - required:
        - kind
        - value
        type: object
        properties:
          kind:
            type: string
            enum:
            - date
          value:
            pattern: "^\\d{4}(-\\d{2})?$"
            type: string
            example: 2024-06
        additionalProperties: false
      - required:
        - kind
        type: object
        properties:
          kind:
            type: string
            enum:
            - present
          asOf:
            pattern: "^\\d{4}(-\\d{2})?$"
            type: string
            description: Reliable source date used to compare Present with an explicit date.
        additionalProperties: false
      - required:
        - kind
        type: object
        properties:
          kind:
            type: string
            enum:
            - missing
        additionalProperties: false
    ClaimMergeComparableValue:
      description: "A scalar, list, or normalized date that can appear in a claim merge comparison."
      oneOf:
      - type: string
      - type: array
        items:
          type: string
      - $ref: "#/components/schemas/ClaimMergeDateValue"
    ClaimMergeFieldSame:
      required:
      - kind
      type: object
      properties:
        kind:
          type: string
          enum:
          - same
        value:
          $ref: "#/components/schemas/ClaimMergeComparableValue"
      additionalProperties: false
      description: Both claims provide the same value; no candidate decision is needed.
    ClaimMergeFieldEnrichment:
      required:
      - from
      - kind
      - value
      type: object
      properties:
        kind:
          type: string
          enum:
          - enrichment
        value:
          $ref: "#/components/schemas/ClaimMergeComparableValue"
        from:
          type: string
          enum:
          - left
          - right
          - both
      additionalProperties: false
      description: "One claim adds a missing value, or both lists can be combined safely."
    ClaimMergeFieldDatePrecisionImprovement:
      required:
      - from
      - kind
      - value
      type: object
      properties:
        kind:
          type: string
          enum:
          - precision_improvement
        value:
          $ref: "#/components/schemas/ClaimMergeDateValue"
        from:
          type: string
          enum:
          - left
          - right
      additionalProperties: false
      description: "Both dates agree, and one provides greater precision; no candidate decision is needed."
    ClaimMergeFieldDateCompatible:
      required:
      - kind
      - left
      - right
      type: object
      properties:
        kind:
          type: string
          enum:
          - compatible
        left:
          $ref: "#/components/schemas/ClaimMergeDateValue"
        right:
          $ref: "#/components/schemas/ClaimMergeDateValue"
      additionalProperties: false
      description: "The dates may both be valid, but the candidate must choose the final value."
    ClaimMergeFieldDateWarning:
      required:
      - kind
      - left
      - right
      type: object
      properties:
        kind:
          type: string
          enum:
          - warning
        left:
          $ref: "#/components/schemas/ClaimMergeDateValue"
        right:
          $ref: "#/components/schemas/ClaimMergeDateValue"
      additionalProperties: false
      description: "The dates cannot be compared confidently, so the candidate must review them."
    ClaimMergeFieldConflict:
      required:
      - kind
      - left
      - right
      type: object
      properties:
        kind:
          type: string
          enum:
          - conflict
        left:
          $ref: "#/components/schemas/ClaimMergeComparableValue"
        right:
          $ref: "#/components/schemas/ClaimMergeComparableValue"
      additionalProperties: false
      description: The claims disagree and the candidate must choose the final value.
    ClaimMergeFieldComparison:
      description: "Comparison outcome for one claim field, selected by the kind discriminator."
      discriminator:
        propertyName: kind
        mapping:
          same: "#/components/schemas/ClaimMergeFieldSame"
          enrichment: "#/components/schemas/ClaimMergeFieldEnrichment"
          precision_improvement: "#/components/schemas/ClaimMergeFieldDatePrecisionImprovement"
          compatible: "#/components/schemas/ClaimMergeFieldDateCompatible"
          warning: "#/components/schemas/ClaimMergeFieldDateWarning"
          conflict: "#/components/schemas/ClaimMergeFieldConflict"
      oneOf:
      - $ref: "#/components/schemas/ClaimMergeFieldSame"
      - $ref: "#/components/schemas/ClaimMergeFieldEnrichment"
      - $ref: "#/components/schemas/ClaimMergeFieldDatePrecisionImprovement"
      - $ref: "#/components/schemas/ClaimMergeFieldDateCompatible"
      - $ref: "#/components/schemas/ClaimMergeFieldDateWarning"
      - $ref: "#/components/schemas/ClaimMergeFieldConflict"
    ClaimMergeProposal:
      required:
      - fields
      - identity
      - left
      - proposedValues
      - recommendedAction
      - requiresCandidateChoice
      - result
      - right
      - survivorClaimId
      - survivorReason
      - unresolvedFields
      type: object
      properties:
        result:
          type: string
          enum:
          - proposal
        identity:
          type: string
          enum:
          - equivalent
          - suspected_duplicate
        left:
          $ref: "#/components/schemas/ClaimVersionReference"
        right:
          $ref: "#/components/schemas/ClaimVersionReference"
        survivorClaimId:
          type: string
          format: uuid
          nullable: true
        survivorReason:
          type: string
          nullable: true
          enum:
          - candidate_authority
          - accepted_status
          - oldest_pending
          - claim_id_tiebreaker
        fields:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ClaimMergeFieldComparison"
          description: "Claim field names mapped to their comparison outcome. Compatible, warning, and conflict outcomes require candidate review."
        proposedValues:
          type: object
          additionalProperties: true
        proposedCurrent:
          type: boolean
          nullable: true
        unresolvedFields:
          type: array
          description: "Field names classified as compatible, warning, or conflict."
          items:
            type: string
        requiresCandidateChoice:
          type: boolean
        recommendedAction:
          type: string
          enum:
          - automatic_coalesce
          - candidate_review
      additionalProperties: false
    ClaimMergeProposalResponse:
      allOf:
      - $ref: "#/components/schemas/SuccessEnvelope"
      - required:
        - data
        type: object
        properties:
          data:
            oneOf:
            - $ref: "#/components/schemas/ClaimMergeNoProposal"
            - $ref: "#/components/schemas/ClaimMergeProposal"
    ClaimMergeCandidateListResponse:
      allOf:
      - $ref: "#/components/schemas/SuccessEnvelope"
      - required:
        - data
        type: object
        properties:
          data:
            type: array
            items:
              $ref: "#/components/schemas/ClaimMergeProposal"
    ClaimNoMergeResult:
      required:
      - reason
      - result
      type: object
      properties:
        result:
          type: string
          enum:
          - no_merge
        reason:
          type: string
          enum:
          - different_candidate
          - different_type
          - different_identity
          - unsupported_type
          - same_claim
          - rejected_claim
